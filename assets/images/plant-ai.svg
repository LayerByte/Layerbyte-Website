<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPlant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14112e"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <rect width="500" height="300" fill="url(#bgPlant)"/>

  <!-- Window UI Frame -->
  <rect x="40" y="30" width="420" height="240" rx="10" fill="#130b26" stroke="#c770f0" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="40" y="30" width="420" height="32" rx="10" fill="#1e123a"/>
  <circle cx="60" cy="46" r="4" fill="#ef4444"/>
  <circle cx="72" cy="46" r="4" fill="#eab308"/>
  <circle cx="84" cy="46" r="4" fill="#22c55e"/>
  <text x="250" y="50" fill="#bfa8d8" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">Plant_AI — Leaf Disease Detection (PyTorch)</text>

  <!-- Left: Scanning Box & Leaf -->
  <g transform="translate(65, 80)">
    <rect x="0" y="0" width="160" height="160" rx="10" fill="#191136" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <!-- Botanical Leaf Shape -->
    <path d="M 80 20 C 130 50, 140 110, 80 140 C 20 110, 30 50, 80 20 Z" fill="url(#leafGrad)"/>
    <path d="M 80 20 L 80 140" stroke="#86efac" stroke-width="2"/>
    <path d="M 80 60 Q 105 50 115 65" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <path d="M 80 85 Q 55 75 45 90" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <path d="M 80 110 Q 105 100 115 115" fill="none" stroke="#86efac" stroke-width="1.5"/>

    <!-- Scanning line with glow -->
    <line x1="10" y1="80" x2="150" y2="80" stroke="#c770f0" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- Right: Neural Network Stats & Results -->
  <g transform="translate(250, 85)">
    <rect x="0" y="0" width="180" height="46" rx="6" fill="#20133d" stroke="#c770f0" stroke-width="1"/>
    <text x="12" y="20" fill="#a493c4" font-family="sans-serif" font-size="9" text-transform="uppercase">Disease Classification</text>
    <text x="12" y="38" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">Healthy Tomato Leaf (98.6%)</text>

    <!-- CNN Architecture nodes illustration -->
    <g transform="translate(0, 65)">
      <!-- Layer 1 -->
      <circle cx="20" cy="15" r="7" fill="#623686" stroke="#c770f0" stroke-width="1.5"/>
      <circle cx="20" cy="40" r="7" fill="#623686" stroke="#c770f0" stroke-width="1.5"/>
      <circle cx="20" cy="65" r="7" fill="#623686" stroke="#c770f0" stroke-width="1.5"/>

      <!-- Layer 2 -->
      <circle cx="80" cy="10" r="7" fill="#8736bb" stroke="#c770f0" stroke-width="1.5"/>
      <circle cx="80" cy="30" r="7" fill="#8736bb" stroke="#c770f0" stroke-width="1.5"/>
      <circle cx="80" cy="50" r="7" fill="#8736bb" stroke="#c770f0" stroke-width="1.5"/>
      <circle cx="80" cy="70" r="7" fill="#8736bb" stroke="#c770f0" stroke-width="1.5"/>

      <!-- Layer 3 -->
      <circle cx="140" cy="25" r="7" fill="#c770f0"/>
      <circle cx="140" cy="55" r="7" fill="#c770f0"/>

      <!-- Synaptic Connection lines -->
      <line x1="27" y1="15" x2="73" y2="10" stroke="#623686" stroke-width="1" opacity="0.6"/>
      <line x1="27" y1="15" x2="73" y2="30" stroke="#623686" stroke-width="1" opacity="0.6"/>
      <line x1="27" y1="40" x2="73" y2="30" stroke="#c770f0" stroke-width="1" opacity="0.7"/>
      <line x1="27" y1="40" x2="73" y2="50" stroke="#623686" stroke-width="1" opacity="0.6"/>
      <line x1="27" y1="65" x2="73" y2="50" stroke="#623686" stroke-width="1" opacity="0.6"/>
      <line x1="27" y1="65" x2="73" y2="70" stroke="#c770f0" stroke-width="1" opacity="0.7"/>

      <line x1="87" y1="30" x2="133" y2="25" stroke="#c770f0" stroke-width="1.5"/>
      <line x1="87" y1="50" x2="133" y2="25" stroke="#623686" stroke-width="1" opacity="0.6"/>
      <line x1="87" y1="50" x2="133" y2="55" stroke="#c770f0" stroke-width="1.5"/>
    </g>
  </g>
</svg>
