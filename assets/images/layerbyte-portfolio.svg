<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPort" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1f3d"/>
      <stop offset="100%" stop-color="#040914"/>
    </linearGradient>
  </defs>

  <rect width="500" height="300" fill="url(#bgPort)"/>

  <!-- Window UI Frame -->
  <rect x="40" y="30" width="420" height="240" rx="10" fill="#08142b" stroke="#3977da" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="40" y="30" width="420" height="32" rx="10" fill="#0e2247"/>
  <circle cx="60" cy="46" r="4" fill="#ef4444"/>
  <circle cx="72" cy="46" r="4" fill="#eab308"/>
  <circle cx="84" cy="46" r="4" fill="#22c55e"/>
  <text x="250" y="50" fill="#86a6d5" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">LayerByte | Official Portfolio</text>

  <!-- Hero Content inside mockup -->
  <g transform="translate(60, 75)">
    <text x="0" y="25" fill="#f5f8ff" font-family="sans-serif" font-size="16" font-weight="bold">Hi There! 👋🏻</text>
    <text x="0" y="50" fill="#f5f8ff" font-family="sans-serif" font-size="20" font-weight="900">I'M <tspan fill="#3977da">LAYERBYTE</tspan></text>
    <rect x="0" y="65" width="170" height="20" rx="4" fill="#0c1b38" stroke="#3977da" stroke-width="1"/>
    <text x="10" y="79" fill="#86a6d5" font-family="monospace" font-size="10">Systems &amp; Security Dev</text>

    <!-- Mini buttons -->
    <rect x="0" y="98" width="75" height="22" rx="4" fill="#065ec0"/>
    <text x="37" y="112" fill="#ffffff" font-family="sans-serif" font-size="9" text-anchor="middle">Projects</text>
    <rect x="85" y="98" width="75" height="22" rx="4" fill="#08152e" stroke="#3977da" stroke-width="1"/>
    <text x="122" y="112" fill="#86a6d5" font-family="sans-serif" font-size="9" text-anchor="middle">Resume</text>
  </g>

  <!-- Mini Illustration inside mockup -->
  <g transform="translate(290, 80) scale(0.65)">
    <circle cx="100" cy="80" r="70" fill="#0e2347" stroke="#3977da" stroke-width="2"/>
    <rect x="60" y="60" width="80" height="50" rx="6" fill="#060e1d" stroke="#3977da" stroke-width="1.5"/>
    <rect x="75" y="72" width="50" height="4" rx="2" fill="#3977da"/>
    <rect x="75" y="82" width="35" height="4" rx="2" fill="#86a6d5"/>
    <rect x="50" y="115" width="100" height="6" rx="3" fill="#065ec0"/>
  </g>
</svg>
