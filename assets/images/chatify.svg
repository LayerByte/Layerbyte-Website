<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgChat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e33"/>
      <stop offset="100%" stop-color="#0e071c"/>
    </linearGradient>
    <linearGradient id="chatBubble" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#623686"/>
      <stop offset="100%" stop-color="#c770f0"/>
    </linearGradient>
  </defs>

  <rect width="500" height="300" fill="url(#bgChat)"/>
  
  <!-- Window UI Frame -->
  <rect x="40" y="30" width="420" height="240" rx="10" fill="#130b26" stroke="#c770f0" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="40" y="30" width="420" height="32" rx="10" fill="#1e123a"/>
  <circle cx="60" cy="46" r="4" fill="#ef4444"/>
  <circle cx="72" cy="46" r="4" fill="#eab308"/>
  <circle cx="84" cy="46" r="4" fill="#22c55e"/>
  <text x="250" y="50" fill="#bfa8d8" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">Chatify — Realtime Messaging</text>

  <!-- Left Sidebar (Channels/Users) -->
  <rect x="40" y="62" width="110" height="208" fill="#160d2e"/>
  <circle cx="65" cy="85" r="10" fill="#c770f0"/>
  <rect x="82" y="81" width="55" height="8" rx="4" fill="#fff" opacity="0.8"/>
  
  <circle cx="65" cy="115" r="10" fill="#623686"/>
  <rect x="82" y="111" width="45" height="8" rx="4" fill="#fff" opacity="0.6"/>

  <circle cx="65" cy="145" r="10" fill="#432870"/>
  <rect x="82" y="141" width="50" height="8" rx="4" fill="#fff" opacity="0.6"/>

  <!-- Chat Area & Messages -->
  <!-- Left incoming message -->
  <rect x="170" y="85" width="160" height="42" rx="8" fill="#241544" stroke="#623686" stroke-width="1"/>
  <text x="182" y="104" fill="#e2d9f3" font-family="sans-serif" font-size="10">Hey Soumya! Did you finish</text>
  <text x="182" y="118" fill="#e2d9f3" font-family="sans-serif" font-size="10">the real-time sockets feature?</text>

  <!-- Right outgoing message -->
  <rect x="250" y="140" width="180" height="42" rx="8" fill="url(#chatBubble)"/>
  <text x="262" y="159" fill="#ffffff" font-family="sans-serif" font-size="10">Yes! WebSockets &amp; Firebase</text>
  <text x="262" y="173" fill="#ffffff" font-family="sans-serif" font-size="10">are fully connected! 🚀</text>

  <!-- Typing input box -->
  <rect x="170" y="215" width="260" height="34" rx="6" fill="#1a0f33" stroke="#c770f0" stroke-width="1"/>
  <text x="185" y="236" fill="#8d7ea8" font-family="sans-serif" font-size="11">Type a message...</text>
  <circle cx="410" cy="232" r="9" fill="#c770f0"/>
  <polygon points="407,227 415,232 407,237" fill="#130b26"/>
</svg>
