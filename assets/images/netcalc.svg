<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1f3d"/>
      <stop offset="100%" stop-color="#040914"/>
    </linearGradient>
  </defs>

  <rect width="500" height="300" fill="url(#bgNet)"/>

  <!-- Window UI Frame -->
  <rect x="40" y="30" width="420" height="240" rx="10" fill="#08142b" stroke="#3977da" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="40" y="30" width="420" height="32" rx="10" fill="#0e2247"/>
  <circle cx="60" cy="46" r="4" fill="#ef4444"/>
  <circle cx="72" cy="46" r="4" fill="#eab308"/>
  <circle cx="84" cy="46" r="4" fill="#22c55e"/>
  <text x="250" y="50" fill="#86a6d5" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">netcalc — Subnet &amp; Network Diagnostics Engine</text>

  <!-- Left: CIDR Calculation Card -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="220" height="150" rx="8" fill="#050e1f" stroke="#3977da" stroke-width="1"/>
    <text x="14" y="24" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">192.168.10.0 /24</text>
    <line x1="14" y1="36" x2="206" y2="36" stroke="#0e2247" stroke-width="1"/>

    <text x="14" y="58" fill="#86a6d5" font-family="sans-serif" font-size="10">Subnet Mask:</text>
    <text x="120" y="58" fill="#ffffff" font-family="monospace" font-size="10">255.255.255.0</text>

    <text x="14" y="80" fill="#86a6d5" font-family="sans-serif" font-size="10">Usable Hosts:</text>
    <text x="120" y="80" fill="#3977da" font-family="monospace" font-size="10" font-weight="bold">254 Hosts</text>

    <text x="14" y="102" fill="#86a6d5" font-family="sans-serif" font-size="10">First Host:</text>
    <text x="120" y="102" fill="#ffffff" font-family="monospace" font-size="10">192.168.10.1</text>

    <text x="14" y="124" fill="#86a6d5" font-family="sans-serif" font-size="10">Broadcast:</text>
    <text x="120" y="124" fill="#86a6d5" font-family="monospace" font-size="10">192.168.10.255</text>
  </g>

  <!-- Right: Network Packet Topology Visualizer -->
  <g transform="translate(300, 80)">
    <rect x="0" y="0" width="140" height="150" rx="8" fill="#07152e" stroke="#065ec0" stroke-width="1"/>
    
    <!-- Central Router Node -->
    <circle cx="70" cy="75" r="22" fill="#065ec0" stroke="#3977da" stroke-width="2"/>
    <text x="70" y="80" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">GW</text>

    <!-- Subnet Nodes -->
    <circle cx="28" cy="35" r="12" fill="#0b1e3d" stroke="#86a6d5" stroke-width="1.5"/>
    <circle cx="112" cy="35" r="12" fill="#0b1e3d" stroke="#86a6d5" stroke-width="1.5"/>
    <circle cx="28" cy="115" r="12" fill="#0b1e3d" stroke="#86a6d5" stroke-width="1.5"/>
    <circle cx="112" cy="115" r="12" fill="#0b1e3d" stroke="#86a6d5" stroke-width="1.5"/>

    <!-- Connecting Link Lines -->
    <line x1="36" y1="43" x2="56" y2="61" stroke="#3977da" stroke-width="1.5"/>
    <line x1="104" y1="43" x2="84" y2="61" stroke="#3977da" stroke-width="1.5"/>
    <line x1="36" y1="107" x2="56" y2="89" stroke="#3977da" stroke-width="1.5"/>
    <line x1="104" y1="107" x2="84" y2="89" stroke="#3977da" stroke-width="1.5"/>
  </g>
</svg>
