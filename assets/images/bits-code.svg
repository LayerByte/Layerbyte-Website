<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBlog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e30"/>
      <stop offset="100%" stop-color="#0b0517"/>
    </linearGradient>
  </defs>

  <rect width="500" height="300" fill="url(#bgBlog)"/>

  <!-- Window UI Frame -->
  <rect x="40" y="30" width="420" height="240" rx="10" fill="#130b26" stroke="#c770f0" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="40" y="30" width="420" height="32" rx="10" fill="#1e123a"/>
  <circle cx="60" cy="46" r="4" fill="#ef4444"/>
  <circle cx="72" cy="46" r="4" fill="#eab308"/>
  <circle cx="84" cy="46" r="4" fill="#22c55e"/>
  <text x="250" y="50" fill="#bfa8d8" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">Bits-0f-C0de — Tech Blog</text>

  <!-- Blog Banner -->
  <rect x="65" y="75" width="370" height="65" rx="6" fill="#261747" stroke="#623686" stroke-width="1"/>
  <text x="85" y="100" fill="#c770f0" font-family="sans-serif" font-size="13" font-weight="bold">Mastering React Hooks &amp; Next.js 14</text>
  <text x="85" y="120" fill="#a493c4" font-family="sans-serif" font-size="10">Deep dive into performance optimizations, server actions, and SSR...</text>

  <!-- Markdown code snippet block inside blog -->
  <rect x="65" y="152" width="370" height="98" rx="6" fill="#0d071a" stroke="#c770f0" stroke-width="1"/>
  <rect x="65" y="152" width="370" height="20" rx="6" fill="#1b1033"/>
  <text x="80" y="166" fill="#c770f0" font-family="monospace" font-size="9">useCustomHook.ts</text>

  <text x="80" y="188" fill="#38bdf8" font-family="monospace" font-size="10">const [data, setData] = useState&lt;Item[]&gt;([]);</text>
  <text x="80" y="204" fill="#e879f9" font-family="monospace" font-size="10">useEffect(() =&gt; {</text>
  <text x="100" y="220" fill="#4ade80" font-family="monospace" font-size="10">  fetchPosts().then(res =&gt; setData(res));</text>
  <text x="80" y="236" fill="#e879f9" font-family="monospace" font-size="10">}, []);</text>
</svg>
