<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1936"/>
      <stop offset="100%" stop-color="#030814"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3977da"/>
      <stop offset="100%" stop-color="#065ec0"/>
    </linearGradient>
  </defs>

  <rect width="500" height="300" fill="url(#bgCert)"/>

  <!-- Window UI Frame -->
  <rect x="40" y="30" width="420" height="240" rx="10" fill="#071329" stroke="#3977da" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="40" y="30" width="420" height="32" rx="10" fill="#0d2042"/>
  <circle cx="60" cy="46" r="4" fill="#ef4444"/>
  <circle cx="72" cy="46" r="4" fill="#eab308"/>
  <circle cx="84" cy="46" r="4" fill="#22c55e"/>
  <text x="250" y="50" fill="#86a6d5" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">certwatch — TLS Certificate Expiration Checker (Go)</text>

  <!-- Left: Certificate Verification Card -->
  <g transform="translate(65, 80)">
    <rect x="0" y="0" width="220" height="150" rx="8" fill="#050e1f" stroke="#3977da" stroke-width="1"/>
    
    <!-- Lock & Domain -->
    <text x="14" y="25" fill="#22c55e" font-family="monospace" font-size="11" font-weight="bold">🔒 *.layerbyte.net</text>
    <line x1="14" y1="36" x2="206" y2="36" stroke="#0e2247" stroke-width="1"/>

    <text x="14" y="58" fill="#86a6d5" font-family="sans-serif" font-size="10">Issuer:</text>
    <text x="80" y="58" fill="#ffffff" font-family="monospace" font-size="9">Let's Encrypt E6</text>

    <text x="14" y="80" fill="#86a6d5" font-family="sans-serif" font-size="10">Valid Days:</text>
    <text x="80" y="80" fill="#22c55e" font-family="monospace" font-size="10" font-weight="bold">82 Days Remaining</text>

    <text x="14" y="102" fill="#86a6d5" font-family="sans-serif" font-size="10">Key Type:</text>
    <text x="80" y="102" fill="#86a6d5" font-family="monospace" font-size="9">ECDSA (P-256)</text>

    <text x="14" y="124" fill="#86a6d5" font-family="sans-serif" font-size="10">Status:</text>
    <text x="80" y="124" fill="#3977da" font-family="monospace" font-size="9" font-weight="bold">HEALTHY &#8226; AUTO-RENEW</text>
  </g>

  <!-- Right: Shield & Security Checkmark -->
  <g transform="translate(310, 80)">
    <rect x="0" y="0" width="130" height="150" rx="8" fill="#07152e" stroke="#065ec0" stroke-width="1"/>
    
    <!-- Shield Graphic -->
    <path d="M 65 30 L 105 45 C 105 85, 65 110, 65 120 C 65 110, 25 85, 25 45 Z" fill="url(#shieldGrad)" stroke="#86a6d5" stroke-width="1.5"/>
    
    <!-- Checkmark inside shield -->
    <path d="M 48 70 L 60 82 L 82 58" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="65" y="136" fill="#86a6d5" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ACTIVE MONITOR</text>
  </g>
</svg>
