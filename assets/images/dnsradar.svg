<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDns" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1f3d"/>
      <stop offset="100%" stop-color="#040914"/>
    </linearGradient>
  </defs>

  <rect width="500" height="300" fill="url(#bgDns)"/>

  <!-- Window UI Frame -->
  <rect x="40" y="30" width="420" height="240" rx="10" fill="#071329" stroke="#3977da" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="40" y="30" width="420" height="32" rx="10" fill="#0d2042"/>
  <circle cx="60" cy="46" r="4" fill="#ef4444"/>
  <circle cx="72" cy="46" r="4" fill="#eab308"/>
  <circle cx="84" cy="46" r="4" fill="#22c55e"/>
  <text x="250" y="50" fill="#86a6d5" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">dnsradar — High Speed DNS CLI &amp; Resolver Monitor (Go)</text>

  <!-- Left: CLI Query Simulation -->
  <g transform="translate(60, 75)">
    <rect x="0" y="0" width="220" height="155" rx="6" fill="#040b17" stroke="#065ec0" stroke-width="1"/>
    
    <text x="12" y="24" fill="#86a6d5" font-family="monospace" font-size="10">$ dnsradar query layerbyte.net</text>
    <line x1="12" y1="34" x2="208" y2="34" stroke="#0e2247" stroke-width="1"/>

    <text x="12" y="54" fill="#3977da" font-family="monospace" font-size="9">A RECORD: 104.21.58.12</text>
    <text x="12" y="70" fill="#3977da" font-family="monospace" font-size="9">AAAA:    2606:4700::6815</text>
    <text x="12" y="86" fill="#ffffff" font-family="monospace" font-size="9">NS:      ns1.cloudflare.com</text>
    <text x="12" y="102" fill="#86a6d5" font-family="monospace" font-size="9">MX:      mail.layerbyte.net</text>
    <text x="12" y="125" fill="#4ade80" font-family="monospace" font-size="10">TTL: 300s | Latency: 12ms</text>
  </g>

  <!-- Right: Radar Target Sweep Graphic -->
  <g transform="translate(300, 75)">
    <rect x="0" y="0" width="140" height="155" rx="6" fill="#07152e" stroke="#3977da" stroke-width="1"/>
    
    <!-- Radar Rings -->
    <circle cx="70" cy="78" r="55" fill="none" stroke="#0e2854" stroke-width="1"/>
    <circle cx="70" cy="78" r="38" fill="none" stroke="#12356d" stroke-width="1"/>
    <circle cx="70" cy="78" r="20" fill="none" stroke="#3977da" stroke-width="1.5"/>
    <circle cx="70" cy="78" r="4" fill="#ffffff"/>

    <!-- Radar Crosshairs -->
    <line x1="15" y1="78" x2="125" y2="78" stroke="#12356d" stroke-width="1"/>
    <line x1="70" y1="23" x2="70" y2="133" stroke="#12356d" stroke-width="1"/>

    <!-- Sweep Beam -->
    <polygon points="70,78 115,40 120,65" fill="rgba(57, 119, 218, 0.35)"/>

    <!-- Blip targets -->
    <circle cx="95" cy="55" r="3" fill="#3977da"/>
    <circle cx="50" cy="98" r="3" fill="#86a6d5"/>
  </g>
</svg>
